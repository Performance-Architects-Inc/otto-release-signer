name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      # the same interpreter set-up as sign.yml: a venv, so `python -I` still sees cryptography
      - run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/python" -m pip install -q --disable-pip-version-check "cryptography==50.0.0"
      - run: '"$RUNNER_TEMP/venv/bin/python" -m unittest discover tests -v'
